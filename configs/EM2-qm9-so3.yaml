# task name for logging
task_name: EM-Phrase2/qm9-so3-harmonic

# unique seed for experiment reproducibility
seed: 42

# data config
datamodule: BaseDataModule
datamodule_args:
    partition: qm9
    dataloader_args:
        batch_size: 64
        num_workers: 4
        pin_memory: false
        persistent_workers: true

# model config
model: BaseFlow
model_args:
    # network args
    network_type: TorchMDDynamics
    hidden_channels: 160
    num_layers: 20
    num_rbf: 64
    rbf_type: expnorm
    trainable_rbf: true
    activation: silu
    neighbor_embedding: true
    cutoff_lower: 0.0
    cutoff_upper: 10.0
    max_z: 100
    node_attr_dim: 10
    edge_attr_dim: 1
    attn_activation: silu
    num_heads: 8
    distance_influence: both
    reduce_op: sum
    qk_norm: true
    clip_during_norm: true
    so3_equivariant: true
    output_layer_norm: true
    # ebm args
    energy_finetune: true
    energy_finetune_weight: 0.1

    # flow matching specific
    sigma: 0.1
    prior_type: harmonic

    # optimizer args
    optimizer_type: AdamW
    lr: 7.e-4
    weight_decay: 1.e-8

    # lr scheduler args
    lr_scheduler_type: CosineAnnealingWarmupRestarts
    first_cycle_steps: 300_000
    cycle_mult: 1.0
    max_lr: 7.e-4
    min_lr: 1.e-8
    warmup_steps: 0
    gamma: 0.05
    last_epoch: -1
    lr_scheduler_monitor: val/loss
    lr_scheduler_interval: step
    lr_scheduler_frequency: 1

# callbacks
callbacks:
    -   callback: ModelCheckpoint
        callback_args:
            dirpath: './checkpoint'
            monitor: val/loss
            mode: min
            save_last: true
            every_n_epochs: 1
            save_top_k: 3

    -   callback: LearningRateMonitor
        callback_args:
            log_momentum: false
            logging_interval: null


# logger
logger: WandbLogger
logger_args:
    project: EnConFlow
    entity: rich_xu

# trainer
trainer: Trainer
trainer_args:
    max_epochs: 1000
    devices: 4
    # limit_train_batches: 100
    # limit_val_batches: 20
    strategy: ddp_find_unused_parameters_true
    accelerator: auto

# eval config
eval_args:
    batch_size: 32
    sampler_args:
        sampler_type: ode
        n_timesteps: 1
        s_churn: 1.0
        t_min: 0.0001
        t_max: 0.9999
        std: 1.0

pretrained_ckpt: checkpoints/EM-Phrase1/qm9-so3-harmonic/epoch=988-step=274942.ckpt
